name: Performance (k6)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API URL for load test'
        required: true
        type: string
  schedule:
    - cron: '0 4 * * 1'

jobs:
  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/performance/k6-flow.js
        env:
          API_URL: ${{ inputs.target_url || vars.STAGING_API_URL || 'http://localhost:3000' }}
          FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL || 'http://localhost:3001' }}
